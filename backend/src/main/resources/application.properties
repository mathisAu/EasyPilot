spring.application.name=easypilot-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://ep-sweet-forest-b210o1ni-pooler.c-6.eu-central-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

app.storage.location=./data/uploads

app.security.admin-username=admin
app.security.admin-password=changeme
