spring.application.name=easypilot-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://ep-steep-leaf-b1pbjc10-pooler.c-5.eu-central-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

app.storage.s3.endpoint=${STORAGE_ENDPOINT:https://br-noisy-waterfall-b27abwhe.storage.c-6.eu-central-1.aws.neon.tech}
app.storage.s3.region=${STORAGE_REGION:eu-central-1}
app.storage.s3.bucket=${STORAGE_BUCKET:easypilot-uploads}
app.storage.s3.access-key=${STORAGE_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_SECRET_KEY:}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-3.8-flash

app.security.admin-username=admin
app.security.admin-password=changeme

app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:EasyPilot <onboarding@resend.dev>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
